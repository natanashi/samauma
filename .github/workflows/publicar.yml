# Publica o app Next no GitHub Pages.
#
# O Pages serve arquivo pronto, sem Node do lado do servidor: por isso o build
# exporta o site inteiro (`output: export`) e este workflow envia a pasta `out`.
# A versao anterior, em HTML puro, segue disponivel em /samauma/legacy/.
name: publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez, sem cancelar a que ja esta subindo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Build estatico
        run: npm run build
      - name: Levar junto a versao anterior
        run: cp -r legacy out/legacy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
