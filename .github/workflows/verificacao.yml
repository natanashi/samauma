# Roda a verificacao do projeto a cada push e a cada pull request.
# Se o ciclo quebrar de novo, quebra aqui antes de chegar na apresentacao.
name: verificacao

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar verificacao
        run: node verificacao.js
